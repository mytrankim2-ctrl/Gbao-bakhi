name: Build Gbao APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix SDK location
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          find . -name "build.gradle" -exec dirname {} \; | while read d; do echo "sdk.dir=$ANDROID_HOME" > "$d/local.properties"; done

      - name: Build APK
        run: |
          GRADLE=$(find . -name gradlew | head -1)
          chmod +x $GRADLE
          DIR=$(dirname $GRADLE)
          cd $DIR
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gbao-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: warn
