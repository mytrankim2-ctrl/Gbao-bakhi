name: Build Gbao APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Fix SDK location for VirtualApp
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "sdk.dir=$ANDROID_HOME" > VirtualApp-master/VirtualApp/local.properties || true
          echo "sdk.dir=$ANDROID_HOME" > VirtualApp-master/local.properties || true
          echo "sdk.dir=$ANDROID_HOME" > VirtualApp/local.properties || true
          echo "sdk.dir=$ANDROID_HOME" > ./VirtualApp-master/VirtualApp/lib/local.properties || true
          find . -name "build.gradle" -exec dirname {} \; | while read d; do echo "sdk.dir=$ANDROID_HOME" > "$d/local.properties"; done
          echo "--- created files ---"
          find . -name "local.properties"

      - name: Build APK
        run: |
          GRADLE=$(find . -name gradlew | head -1)
          chmod +x $GRADLE
          DIR=$(dirname $GRADLE)
          cd $DIR
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
